name: Re:Learn CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up Python venv & Install Dependencies
        run: |
          python -m venv ml/venv
          ml/venv/bin/pip install --upgrade pip
          ml/venv/bin/pip install scikit-learn numpy pyyaml fastapi uvicorn pydantic requests

      - name: Run Prisma DB Push & Seed
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Python & Security Tests
        run: npm run test

      - name: Run Full Master Evaluation Pipeline
        run: npm run eval
